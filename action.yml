name: 'Codex PR Review'
description: >-
  Bring-your-own-key pull request review powered by OpenAI Codex models,
  with the model selectable per run.
author: 'Sokmesa'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  openai_api_key:
    description: 'Your own OpenAI API key. Store this as a secret — never commit it.'
    required: true
  github_token:
    description: 'Token used to read the PR diff and post the review. Defaults to the job token.'
    required: false
    default: ${{ github.token }}
  model:
    description: >-
      OpenAI/Codex model to use for this run (e.g. gpt-5.1-codex,
      gpt-5.1-codex-mini, gpt-5.1, gpt-5-mini, o4-mini). Leave empty to use
      the CODEX_MODEL repository/organization variable if set, otherwise the
      action's built-in default (gpt-5.1-codex). Wire this to a
      workflow_dispatch choice input to let a human pick the model per run —
      see the example workflow in the README.
    required: false
    default: ''
  reasoning_effort:
    description: 'Reasoning effort for models that support it: minimal | low | medium | high.'
    required: false
    default: 'medium'
  max_files:
    description: 'Maximum number of changed files to send for review.'
    required: false
    default: '60'
  max_patch_chars:
    description: 'Maximum characters of a single file patch to send (longer patches are truncated).'
    required: false
    default: '80000'
  post_mode:
    description: >-
      How to post results: "review" posts a formal GitHub review with
      inline comments anchored to diff lines; "comment" posts a single
      plain issue comment with everything folded in.
    required: false
    default: 'review'
  fail_on_error:
    description: >-
      If "true", fail the workflow step when the OpenAI or GitHub API call
      fails. If "false" (default), log a warning and exit successfully so a
      transient API issue never blocks a merge.
    required: false
    default: 'false'

outputs:
  summary:
    description: 'The overall review summary text generated by the model.'
  recommendation:
    description: 'One of approve | comment | request_changes.'
  comment_count:
    description: 'Number of inline comments posted.'
  model:
    description: 'The model that was actually used for this run.'

runs:
  using: 'node24'
  main: 'dist/index.js'
