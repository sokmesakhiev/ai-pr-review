name: 'AI PR Review'
description: >-
  Bring-your-own-key pull request review powered by OpenAI Codex, Anthropic
  Claude, or Google Gemini — provider and model both selectable per run.
author: 'Sokmesa'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  provider:
    description: >-
      Which provider to use: openai | anthropic | gemini. Leave empty to
      infer it from the `model` input (e.g. a `claude-*` model implies
      anthropic); if `model` is also empty, defaults to openai.
    required: false
    default: ''
  openai_api_key:
    description: 'Your own OpenAI API key. Required when provider resolves to openai.'
    required: false
    default: ''
  anthropic_api_key:
    description: 'Your own Anthropic API key. Required when provider resolves to anthropic.'
    required: false
    default: ''
  gemini_api_key:
    description: 'Your own Google AI (Gemini) API key. Required when provider resolves to gemini.'
    required: false
    default: ''
  github_token:
    description: 'Token used to read the PR diff and post the review. Defaults to the job token.'
    required: false
    default: ${{ github.token }}
  model:
    description: >-
      Model to use for this run, e.g. gpt-5.1-codex, claude-opus-5, or
      gemini-3.8-flash. Leave empty to use the CODEX_MODEL
      repository/organization variable if set, otherwise the resolved
      provider's built-in default. Wire this (and `provider`) to
      workflow_dispatch choice inputs to let a human pick per run — see the
      example workflow in the README.
    required: false
    default: ''
  reasoning_effort:
    description: >-
      Reasoning/thinking effort for models that support it: minimal | low |
      medium | high. Each provider maps this onto its own equivalent knob
      (OpenAI reasoning effort, Claude output_config effort, Gemini thinking
      level).
    required: false
    default: 'medium'
  max_files:
    description: 'Maximum number of changed files to send for review.'
    required: false
    default: '60'
  max_patch_chars:
    description: 'Maximum characters of a single file patch to send (longer patches are truncated).'
    required: false
    default: '80000'
  post_mode:
    description: >-
      How to post results: "review" posts a formal GitHub review with
      inline comments anchored to diff lines; "comment" posts a single
      plain issue comment with everything folded in.
    required: false
    default: 'review'
  fail_on_error:
    description: >-
      If "true", fail the workflow step when the provider or GitHub API call
      fails. If "false" (default), log a warning and exit successfully so a
      transient API issue never blocks a merge.
    required: false
    default: 'false'

outputs:
  summary:
    description: 'The overall review summary text generated by the model.'
  recommendation:
    description: 'One of approve | comment | request_changes.'
  comment_count:
    description: 'Number of inline comments posted.'
  provider:
    description: 'The provider that was actually used for this run (openai | anthropic | gemini).'
  model:
    description: 'The model that was actually used for this run.'

runs:
  using: 'node24'
  main: 'dist/index.js'
