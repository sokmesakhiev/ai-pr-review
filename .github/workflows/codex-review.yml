# Example consumer workflow for this action.
#
# Supports three providers — OpenAI (Codex), Anthropic (Claude), and Google
# (Gemini) — behind a single `model` input. The action infers which provider
# to use from the model id's naming convention (gpt-*/o*-mini -> openai,
# claude-* -> anthropic, gemini-* -> gemini), so picking a model is enough;
# you don't also need to set `provider` unless you're using a custom model
# id that doesn't follow those conventions.
#
# Model selection has two paths, both feeding the same `model` input:
#   1. Automatic PR runs use the CODEX_MODEL repository/organization Actions
#      variable if you've set one (Settings → Secrets and variables →
#      Actions → Variables), otherwise the action's built-in default
#      (gpt-5.1-codex).
#   2. Manual runs (Actions tab → "Run workflow") let you pick the model —
#      from any of the three providers — from a dropdown via the
#      workflow_dispatch `model` input below. Handy for A/B-testing models
#      across providers on the same PR without touching any repo settings.
#
# Only the API key secret matching the chosen provider needs to actually be
# set — the other two are simply unused for that run.
#
# Security note: this checkout intentionally always uses the default ref
# (this workflow's own trusted branch), never the PR's head — the action
# never needs the PR's files locally, it reads the diff entirely through the
# GitHub API. Checking out an untrusted PR head before an `if: secrets are
# in scope` step is the classic "pwn request" pattern; don't add a `ref:`
# override here to "fix" workflow_dispatch, and don't switch the automatic
# trigger to `pull_request_target` without understanding that risk first.
name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      model:
        description: 'Model to use for this run (provider is inferred from the id)'
        required: false
        type: choice
        default: 'gpt-5.1-codex'
        options:
          # OpenAI
          - 'gpt-5.1-codex'
          - 'gpt-5.1-codex-mini'
          - 'gpt-5.1'
          - 'gpt-5-mini'
          - 'o4-mini'
          # Anthropic
          - 'claude-opus-5'
          - 'claude-fable-5-1'
          - 'claude-sonnet-5'
          - 'claude-haiku-4-5'
          # Google
          - 'gemini-3.8-flash'
          - 'gemini-3-pro-preview'
          - 'gemini-2.5-flash'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ github.token }}
          # Only set (and only needed) on workflow_dispatch — pull_request
          # events carry the PR number in their own payload already.
          pr_number: ${{ github.event.inputs.pr_number }}
          # workflow_dispatch input wins when present; otherwise empty and
          # the action falls back to vars.CODEX_MODEL, then its own default.
          model: ${{ github.event.inputs.model || vars.CODEX_MODEL }}
          reasoning_effort: 'medium'
          post_mode: 'review'
